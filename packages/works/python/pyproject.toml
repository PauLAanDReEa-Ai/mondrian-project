[project]
name = "mondrian-works"
version = "0.1.0"
description = "Pydantic work schema + derive/vary/catalog (M2)"
requires-python = "==3.12.*"
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mondrian_work_schema"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
